# Build the MarwanOS image on GitHub's runners and push it to GHCR.
#
# Why this exists: the image is ~7 GB. Pushing that from a home connection is
# slow and has to happen on every canonical build. Here the push is GitHub ->
# GitHub, and the only thing leaving your machine is a few hundred KB of source.
# It also removes the personal access token entirely -- GITHUB_TOKEN is injected
# per-run and expires with the job.
#
# This does NOT replace the local loop. A warm local build is ~70 seconds; a CI
# build is cold every time and takes far longer. Iterate locally with
# `./scripts/build-push.sh --no-push`, and let this produce the images the target
# actually consumes.

name: build

on:
  push:
    branches: [main]
    paths:
      - "os/**"
      - "shell/**"
      - "mowser/**"
      - "tests/**"
      - "scripts/check-*.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Candidate image tag (leave empty for main latest)'
        required: false
        type: string

env:
  IMAGE_NAME: marwanos

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Check installation flows before publishing
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-pefile python3-pil python3-dbus python3-gi dbus-daemon squashfs-tools gcc g++
          /usr/bin/python3 -m unittest discover -s tests -v

      - name: Check controller flows before publishing
        run: |
          sudo apt-get install -y curl unzip libfontconfig1 libxkbcommon0 libgl1 libasound2t64
          bash scripts/check-shell.sh

      # A hosted runner has roughly 25 GB free. Base layers plus akmods plus the
      # finished image comfortably exceed that during the build, and running out
      # of space surfaces as a confusing mid-layer error rather than "disk full".
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      # GHCR namespaces must be lowercase, but github.repository_owner preserves
      # the account's capitalisation (MarwanSummakieh). Pushing with capitals is
      # rejected, so normalise it rather than hardcoding the name.
      - name: Compute image reference
        id: ref
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=0.0.$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          tag="${REQUESTED_TAG:-latest}"
          [[ "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || exit 1
          if [[ "$tag" == latest && "${{ github.ref }}" != refs/heads/main ]]; then
            echo 'Feature branches require a candidate image tag.' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          podman build \
            --file os/Containerfile \
            --tag "${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}" \
            --build-arg "MARWANOS_VERSION=${{ steps.ref.outputs.version }}" \
            --build-arg "MARWANOS_COMMIT=$(git rev-parse --short HEAD)" \
            --build-arg "MARWANOS_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        run: |
          podman push "${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}"
          podman push "${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}" \
            "${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}"

      - name: Summary
        run: |
          echo "Pushed ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version ${{ steps.ref.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Stage on the target: \`bootc switch ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Reboot and complete physical acceptance before release promotion." >> "$GITHUB_STEP_SUMMARY"
