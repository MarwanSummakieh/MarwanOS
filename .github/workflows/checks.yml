name: checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned component integration copies
        run: python3 scripts/components.py --verify
  windows-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install hidden-display and app-icon test dependencies
        run: sudo apt-get update && sudo apt-get install -y aria2 xvfb python3-pefile python3-pil python3-dbus python3-gi dbus-daemon squashfs-tools gcc g++
      - name: Exercise installation and process lifecycle
        run: /usr/bin/python3 -m unittest discover -s tests -v
  controller-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install editor runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip libfontconfig1 libxkbcommon0 libgl1 libasound2t64 xvfb xdotool x11-utils dbus-x11 at-spi2-core gir1.2-atspi-2.0 gir1.2-gtk-3.0 python3-gi python3-dbus python3-xlib
      - name: Exercise controller, files, keyboard and app lifecycle
        run: bash scripts/check-shell.sh
