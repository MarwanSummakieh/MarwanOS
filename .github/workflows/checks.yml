name: checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install hidden-display test dependency
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Exercise installation and process lifecycle
        run: python3 -m unittest discover -s tests -v
