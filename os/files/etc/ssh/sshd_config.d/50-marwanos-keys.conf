# Keys baked into the IMAGE, so ssh access survives whatever happened to the
# per-machine half. The bench has been unreachable since 2026-08-08 -- the
# installer's kickstart was supposed to seed authorized_keys and something in
# that chain did not take, and with no terminal on the appliance there is no
# way in to find out which link broke. This file ends that class of lockout:
# the public key ships in /usr, /usr is the ostree commit, and therefore every
# machine that pulls an image can be reached by the machine that built it.
#
# The per-user file under ~/.ssh still works -- this ADDS a search location,
# it does not replace one. %u keeps it per-user: marwan.keys and root.keys are
# separate files, and a user without a file simply has no extra keys.
#
# A PUBLIC key is the only thing here, which is why committing it to the repo
# is fine: it grants nothing by itself, it only names who may knock.
AuthorizedKeysFile .ssh/authorized_keys /usr/lib/marwanos/keys/%u.keys
