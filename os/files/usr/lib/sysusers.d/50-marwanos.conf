# The session user (D3), declared rather than created with useradd.
#
# This is the shape bootc wants, and `bootc container lint` enforces it: an
# /etc/passwd entry with no sysusers.d counterpart is a warning, because /etc is
# three-way merged on upgrade and a user added straight to /etc/passwd in a
# later image can silently fail to appear on a machine whose /etc/passwd has
# already diverged. A declaration in /usr is re-applied on every upgrade, so the
# account cannot go missing on a machine with no console to say so.
#
# The Containerfile also runs systemd-sysusers against this file at build time,
# so the account exists in the image itself and not only after first boot.
#
# What each choice is doing:
#
#   uid/gid 1000 pinned   /var is machine-local and outlives image upgrades. A
#                         uid that drifted between builds would orphan
#                         everything the session had written to /var/home/player.
#   nologin shell         greetd execs `/bin/sh -c "exec <command>"` itself and
#                         never consults the passwd shell -- it only exports it
#                         as $SHELL -- so this costs the session nothing while
#                         closing su, ssh and every other login path into the
#                         account (D6). The account also has no password, which
#                         is fine: greetd's initial_session is unauthenticated
#                         by design, so a locked account still autologins.
#   home not created      sysusers records the path and does not make the
#                         directory, which is what is wanted: /var is populated
#                         once at install, so a home baked into the image would
#                         be a first-boot-only default. tmpfiles.d creates it on
#                         every boot instead.
#   video/render/input    belt and braces over logind's uaccess ACLs, which
#                         already hand the active session its seat's devices.
#                         Cheap, and it removes "the compositor cannot open
#                         /dev/dri/card0" from the list of things the M1 spike
#                         could waste days on.

g player 1000
u player 1000:1000 "MarwanOS session" /var/home/player /usr/sbin/nologin

m player video
m player render
m player input
