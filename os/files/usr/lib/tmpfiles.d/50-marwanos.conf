# The directories the session needs under /var, created on every boot rather
# than baked into the image.
#
# This is not a stylistic preference. In bootc, /var is machine-local state that
# is populated once at install and never touched again by an image upgrade, so
# anything the build leaves there becomes a first-boot-only default that drifts
# from the image forever -- which is why the Containerfile's cleanup step
# deletes the build's own droppings from /var. tmpfiles.d is the mechanism that
# survives that: it runs every boot, it is idempotent, and it ships in /usr
# where upgrades do reach it.
#
# It is also what makes a target recoverable. If /var/home/player is lost or
# arrives wrong, the next boot puts it back instead of leaving a session that
# cannot start on a machine with no console to say so.

# D5's dev override path. Owned by root: only devmode ssh writes here, and the
# session only reads it when /var/marwanos/devmode also exists.
d /var/marwanos           0755 root   root   -
d /var/marwanos/dev-shell 0755 root   root   -

# The session user's home. It is not created by useradd for the reason above.
# gamescope writes its saved modes and patched EDID under here, so it has to
# exist and be owned by player before the first session starts.
d /var/home/player        0700 player player -
