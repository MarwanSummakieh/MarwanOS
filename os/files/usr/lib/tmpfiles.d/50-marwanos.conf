# The directories the session needs under /var, created on every boot rather
# than baked into the image.
#
# This is not a stylistic preference. In bootc, /var is machine-local state that
# is populated once at install and never touched again by an image upgrade, so
# anything the build leaves there becomes a first-boot-only default that drifts
# from the image forever -- which is why the Containerfile's cleanup step
# deletes the build's own droppings from /var. tmpfiles.d is the mechanism that
# survives that: it runs every boot, it is idempotent, and it ships in /usr
# where upgrades do reach it.
#
# It is also what makes a target recoverable. If /var/home/player is lost or
# arrives wrong, the next boot puts it back instead of leaving a session that
# cannot start on a machine with no console to say so.

# D5's dev override path. Owned by root: only devmode ssh writes here, and the
# session only reads it when /var/marwanos/devmode also exists.
d /var/marwanos           0755 root   root   -
d /var/marwanos/dev-shell 0755 root   root   -

# The home directory's standard folders, owned by the session user. A fresh
# appliance home is otherwise EMPTY -- the Files screen showed "nothing", and
# nothing is indistinguishable from broken on a TV. These four give Home its
# shape, give Zen's downloads somewhere to land that Files can then see, and
# give Kodi a Music/Videos to point at. tmpfiles re-asserts them every boot,
# so deleting one from the Files screen is undone rather than permanent --
# which for the folders every app assumes exist is the right call.
d /var/home/player/Downloads 0755 player player -
d /var/home/player/Music     0755 player player -
d /var/home/player/Pictures  0755 player player -
d /var/home/player/Videos    0755 player player -

# Store artwork, prefetched from Flathub by marwanos-storeart so the store
# screen renders logos from disk for applications that are not installed yet.
# Under /var rather than /run because artwork is worth keeping across boots --
# a machine that was online once has a full store forever. Root writes, the
# shell (player) only reads: 0755 root-owned is that arrangement, the same
# one-way flow as every state file under /run/marwanos. The service also
# `install -d`s it, so its existence never depends on which got there first.
d /var/marwanos/store       0755 root root -
d /var/marwanos/store/icons 0755 root root -

# Steam's storefront, fetched by marwanos-steamfront so the Steam tab draws
# Valve's own front page rather than a paragraph about it. Same arrangement and
# the same reasoning as the icons above -- root writes, the shell (player) only
# reads, and it lives under /var so a machine that has been online once still
# has a storefront to draw after a reboot with no network. `front` holds the
# normalised JSON, `front/art` the capsules and screenshots.
d /var/marwanos/store/front     0755 root root -
d /var/marwanos/store/front/art 0755 root root -

# Where system services leave one-word state files for the shell to render:
# netcheck's network.state, flatpak-install's install.<app>.state, appscan's
# apps.tsv. On a tmpfs so
# every boot starts with no claims. The writers also `install -d` it themselves
# -- this line is so the directory's existence never depends on which unit got
# there first.
d /run/marwanos           0755 root   root   -

# The wifi workflow's REQUEST directory -- the one place the shell writes
# rather than reads. Owned by the session user because the shell runs as
# `player` and has to be able to drop a request here; 0700 because a request
# briefly contains a Wi-Fi passphrase and nothing else on this system has any
# business reading it. marwanos-wifi (root) consumes and deletes each request.
# Created here as well as by the service so the directory's existence never
# depends on which of the two started first.
d /run/marwanos/wifi      0700 player player -

# The update workflow's request directory. Same shape and the same reason as
# the wifi one above: the shell writes here, marwanos-update consumes. Nothing
# secret passes through it -- the verbs take no arguments -- but 0700 keeps the
# rule "only the session user asks, only root acts" uniform across both seams.
d /run/marwanos/update    0700 player player -

# The install/remove workflow's request directory. Same shape and the same
# reason as the two above: the shell writes here, marwanos-appctl (root)
# consumes. Nothing secret passes through it, but 0700 keeps the rule "only the
# session user asks, only root acts" uniform across all three seams -- and this
# is the one whose requests carry an argument, so the boundary matters most
# here. See the allow-list in /usr/lib/marwanos/appctl.
d /run/marwanos/apps      0700 player player -

# The eject workflow's request directory. Same shape and the same reason as the
# three above: the shell writes here, marwanos-usbmount (root) consumes.
d /run/marwanos/media     0700 player player -

# The storefront workflow's request directory. Same shape and the same reason
# as the four above: the shell writes here, marwanos-steamfront (root)
# consumes. Its two requests carry no secret -- a category name and a Steam
# appid -- but 0700 keeps the rule "only the session user asks, only root acts"
# uniform across every seam that runs backwards.
d /run/marwanos/steamfront 0700 player player -

# WHERE STICKS GET MOUNTED, and the ownership is the whole point of the line.
# ROOT-owned 0755, so the session user can list what is mounted and cannot
# create a directory here -- which is what lets marwanos-usbmount treat "a mount
# point one level under /run/media/<user>" as proof that it was the mounter,
# rather than having to keep a registry the shell could race. udisks2's layout,
# so a desktop reading this tree later finds what it expects.
#
# Created here as well as by the script for the same reason every other seam
# directory is: the existence of the path must not depend on which of the two
# got there first, and the FIRST thing that looks is the shell's Places view,
# which can open before any stick has ever been plugged in.
d /run/media              0755 root   root   -
d /run/media/player       0755 root   root   -

# The session user's home. It is not created by useradd for the reason above.
# gamescope writes its saved modes and patched EDID under here, so it has to
# exist and be owned by player before the first session starts.
d /var/home/player        0700 player player -

# greetd's rpm ships these under /var, where rpm payloads only materialise at
# install time -- `bootc container lint` flags exactly this, and these four
# lines are its suggested fix verbatim. The symlink masks xdg-desktop-portal
# inside greetd's own user session, which is behaviour worth keeping: an
# appliance session has no portals and nothing should wait on one.
d /var/lib/greetd/.config              0755 greetd greetd -
d /var/lib/greetd/.config/systemd      0755 greetd greetd -
d /var/lib/greetd/.config/systemd/user 0755 greetd greetd -
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
