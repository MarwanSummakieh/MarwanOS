# Flatpak's auto-update, moved out of the boot window.
#
# The stock timer is OnBootSec=2min + a daily 04:00 with Persistent=true --
# and Persistent is the trap on a machine that is off at 04:00 every day of
# its life: the missed calendar run is made up AT BOOT, so `flatpak update`
# plus `flatpak repair` (measured at 15.7s of work on the bench, 2026-08-11)
# lands exactly in the window where gamescope, the shell and a cold Steam
# are all fighting for the disk. Persistent=false plus a later OnBootSec
# keeps the updates -- fifteen minutes into every session is still every
# session -- while keeping the first minute of boot for the boot.
#
# Whether flatpak auto-update belongs on this appliance AT ALL is M4's
# update-policy question (the phase-0 plan asks it about bootc's timer in
# the same breath); this drop-in only takes it out of the boot path and
# deliberately decides nothing else.

[Timer]
OnBootSec=
OnBootSec=15min
Persistent=false
