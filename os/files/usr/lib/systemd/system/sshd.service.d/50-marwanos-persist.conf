# sshd retries forever, because on THIS machine it is the only door.
#
# The 2026-08-10 CI-image boot came up with the shell on the TV and nothing
# listening on 22: same image ran sshd cleanly in a container, same machine
# ran the previous deployment's sshd cleanly an hour earlier, so whatever
# killed it was a boot-time circumstance rather than the config -- and
# systemd's default gives sshd five tries in ten seconds and then abandons
# the machine to its silence. An appliance with no terminal cannot afford a
# door that stays shut because it was rainy at second four of the boot: keep
# knocking, every ten seconds, forever. The cost of a genuinely-broken sshd
# retrying for eternity is one journal line every ten seconds -- which is
# also exactly the diagnostic a broken sshd should be emitting.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10
