# Persistent logging, on from the first image.
#
# Phase 0's whole thesis is a machine with no visible text and no terminal. That
# is only survivable if the logs outlive a reboot -- otherwise every failure that
# happens before you can log in is unreproducible by definition. This was on M2's
# checklist; it moved here the first time a target became unreachable and took
# its journal with it.
#
# Default Storage=auto only persists when /var/log/journal already exists, and
# the image build deliberately empties /var. Being explicit avoids depending on
# a directory that cleanup removes.

[Journal]
Storage=persistent
