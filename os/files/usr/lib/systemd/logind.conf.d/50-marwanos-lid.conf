# The appliance runs with the lid shut. Nothing about a lid switch may ever
# suspend it.
#
# /usr/lib rather than /etc, and that is not a style choice. logind.conf(5) lists
# /usr/lib/systemd/logind.conf.d/ as a search path, and in bootc /etc is
# three-way merged on upgrade -- a drop-in written to /etc on one target becomes
# machine-local state that a later image cannot correct. Same trap
# /etc/greetd/config.toml already carries and warns about in its own header.
# Check what actually took effect with:
#   systemd-analyze cat-config systemd/logind.conf
#
# All three keys, because logind picks exactly ONE of them per lid event
# (src/login/logind-button.c, button_lid_switch_handle_action):
#   1. docked, or >= 1 external display connected -> HandleLidSwitchDocked
#   2. HandleLidSwitchExternalPower, if explicitly set, and on AC
#   3. HandleLidSwitch
# Leaving any of them at its default leaves one of those three paths able to
# suspend the machine. HandleLidSwitchExternalPower is set explicitly rather than
# reasoned about: systemd's source initialises it invalid (i.e. ignored) while
# systemd's own shipped sample config says `suspend`. Setting it costs one line
# and ends the argument.
#
# Relying on branch 1 -- "a TV is attached, so logind treats us as docked" -- is
# the trap this file exists for. logind's external-display count requires the
# HDMI connector's /sys/class/drm/*/enabled to read "enabled", and that attribute
# is true only while some client holds an active modeset (drm_sysfs.c,
# enabled_show reads connector->encoder). Three windows where it is false:
#
#   * before the compositor's first modeset -- logind's HoldoffTimeoutSec expires
#     30s into boot, and the 2026-08-05 film puts this machine's first shell frame
#     at 74s
#   * during every greetd restart, including every cycle of the crash guard
#   * whenever the TV is powered off and drops HPD
#
# In those windows the box looks undocked and branch 3 fires.
#
# And logind acts on an already-closed lid, not only on the closing edge:
# button_check_switches() reads SW_LID with EVIOCGSW when the input device is
# opened. Booting with the lid shut is this appliance's normal case, not an edge
# case, so this is a live suspend path today.
#
# Unaffected by the video= karg that disables the internal panel:
# manager_count_external_displays() counts only VGA-/DVI-*/DP-/HDMI-A-/HDMI-B-/TV-
# style connectors -- eDP, LVDS and DSI are never counted -- so darkening the lid
# panel does not change the count in either direction.

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
