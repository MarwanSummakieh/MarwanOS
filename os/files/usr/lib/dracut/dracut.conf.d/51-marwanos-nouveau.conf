# Nouveau out of the initramfs, and 100 MB of firmware with it.
#
# THIS IS A /boot CAPACITY FIX, not a driver preference. anaconda's autopart
# gives this machine a 1 GiB /boot, and bootc keeps a kernel and an initramfs
# there for every deployment. At 342 MB the initramfs made a deployment cost
# ~360 MB of that partition: two fit, and an UPGRADE -- which briefly holds
# three, the new one alongside the current and the rollback -- needs ~1080 MB
# and does not. What that looks like from the sofa is a bootloader entry that
# exists and boots to a black screen with no plymouth, because the initramfs it
# points at was written into a partition that ran out of room. Reported on
# 2026-08-11 as "you broke the ostree"; the arithmetic above is the whole
# explanation, and no code change caused it -- the image had simply been living
# one upgrade away from the edge.
#
# NOUVEAU IS THE FREE 100 MB, and it is free because this image already
# guarantees the driver can never load: the kargs carry
# `rd.driver.blacklist=nouveau modprobe.blacklist=nouveau` and the proprietary
# module is what drives the display. Its GSP firmware is nonetheless enormous
# and was riding along on every deployment -- /usr/lib/firmware/nvidia/ga102 is
# 74 MB and tu102 another 26 MB, blobs for a driver that is blacklisted twice
# over. dracut pulls firmware for the modules it includes, so omitting the
# module is what drops the blobs.
#
# WHAT IS DELIBERATELY NOT OMITTED. /usr/lib/firmware/nvidia/610.43.03, 109 MB,
# is the PROPRIETARY driver's own GSP firmware and it stays: nvidia-drm.modeset
# needs it to bring the panel up in early boot, which is what makes the boot
# silent (D6) instead of text-then-splash. amdgpu and radeon are another 28 MB
# of hardware this Predator does not have -- and they stay too, because the
# bench is a DIFFERENT machine and an image that cannot boot the second machine
# to save 28 MB on the first is a worse trade than the one this file makes.
#
# The Containerfile asserts all of it after the dracut run: nouveau's firmware
# gone, the proprietary firmware present, and the finished initramfs under a
# size ceiling derived from the /boot budget. A future change that quietly
# re-inflates the initramfs fails the build instead of the machine.
#
# The surrounding spaces are dracut syntax, not formatting: values appended with
# += are concatenated verbatim and run into their neighbours without them.

omit_drivers+=" nouveau "
