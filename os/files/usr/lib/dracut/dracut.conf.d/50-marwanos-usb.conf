# USB mass storage in the initramfs, unconditionally.
#
# History, because this file was born as a fix for the wrong diagnosis and
# survives on different merits. When the Predator's first USB boot hung in
# dracut-initqueue (2026-08-03), the leading theory was a missing `uas` module.
# Elimination disproved it: uas and usb_storage were already in the initramfs,
# xhci-pci and sd_mod are built into the Fedora kernel (=y), and the kernel
# booted the same image over both transports in QEMU. The actual defect was the
# stick's own UAS implementation, fixed per-device with
# usb-storage.quirks=<VID>:<PID>:u (via make-usb.sh EXTRA_KARGS).
#
# These three drivers still belong in any initramfs expected to boot from USB:
# `dracut --no-hostonly` inside a container has no USB storage to observe and
# its default driver list is upstream's to change, so naming them turns an
# implicit dependency into an asserted one.
#
# This is a drop-in in the image rather than only a flag on the Containerfile's
# dracut command line, because an initramfs regenerated later on the target --
# kernel update, `bootc upgrade`, anything -- has to get these drivers too. The
# Containerfile asserts uas.ko is in the initramfs it builds, so if this file
# ever stops being read the build fails rather than the machine.
#
# The surrounding spaces are dracut syntax, not formatting: values appended with
# += are concatenated verbatim and run into their neighbours without them.

add_drivers+=" uas usb_storage sd_mod "
