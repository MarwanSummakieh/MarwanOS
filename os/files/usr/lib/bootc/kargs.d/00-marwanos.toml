# Kernel arguments, baked into the image rather than set by hand on the target.
# Changing this file and running `bootc upgrade` is the only way kargs should
# ever move -- that is the mechanism M0 exists to verify.
#
# M0 keeps this list to what the NVIDIA stack actually needs. The silent-boot
# arguments (quiet, splash, vt.global_cursor_default=0, loglevel suppression)
# land in M2, where a camera test can actually judge whether they worked.
#
# ublue-os-nvidia may already set some of these. Duplicate kargs are harmless,
# but verify with `cat /proc/cmdline` on the target rather than assuming.

kargs = [
    # Required for any Wayland compositor on NVIDIA, gamescope included.
    "nvidia-drm.modeset=1",
    # THE TEARING, aimed at the half of it that was actually measured.
    #
    # The bench work closed the causal loop on 2026-08-12: a freshly-trained
    # link shimmers under gamescope and is clean under plymouth on the SAME
    # link, and the measured difference is the scanout. plymouth scans XR24
    # 8-bit LINEAR with no colorops; gamescope scans XB30 10-bit BLOCK-LINEAR
    # through nvidia-drm color_pipeline PQ-125 EOTF colorop pairs that stay
    # active EVEN WITH GAMESCOPE_COLOR_MANAGEMENT_DISABLE=1. Memory clock,
    # temperature, transport, driver version, shell, page flips and the
    # composition flag were each eliminated in both directions -- six blind
    # trials for composition alone -- so the display profiles cannot reach this
    # and neither can another gamescope flag.
    #
    # NVIDIA added this parameter for exactly this class of bug: it disables
    # DRM color pipeline support as a workaround for compositors that mishandle
    # pipelines containing NON-BYPASSABLE colorops, which is the shape measured
    # here. It arrived in 610.43.02 and this image pins 610.57.04, so it exists.
    #
    # UNPROVEN, and it must be checked on the target rather than believed: a
    # machine-local karg edit outlives every upgrade, so a bench that has ever
    # had its kargs touched by hand may ignore this file entirely. Verify with
    # `cat /proc/cmdline`, NOT by reading this toml, and repair with
    # `rpm-ostree kargs --append=nvidia_drm.color_pipeline=0` if it is absent.
    # If the shimmer survives with this genuinely on the command line, the
    # 10-bit/block-linear half is the remaining suspect and the colorop half is
    # eliminated -- which is worth as much as a fix.
    "nvidia_drm.color_pipeline=0",
    # Gives the NVIDIA driver a real framebuffer console, so early boot draws on
    # the actual display instead of going dark until the compositor starts.
    "nvidia_drm.fbdev=1",
    # nouveau and the proprietary stack cannot both claim the card.
    "rd.driver.blacklist=nouveau",
    "modprobe.blacklist=nouveau",
    # The loading screen instead of scrolling text: kernel messages suppressed,
    # plymouth holds the MarwanOS splash. Pulled forward from M2 the day the
    # first bare-metal boot made the scrolling visible; M2 still owns the
    # camera-verified flash hunt and the handoff polish.
    "quiet",
    "splash",
    "loglevel=3",
    "rd.udev.log_level=3",
    "systemd.show_status=false",
    # Kept even though the image no longer carries console=ttyS0 (make-installer
    # passes --no-default-kernel-args): any serial console arg -- a bib default
    # regression, or a per-stick EXTRA_KARGS -- would otherwise flip plymouth
    # into its serial/details mode and the graphical splash would never appear.
    "plymouth.ignore-serial-consoles",
    # No blinking cursor frames (an M2 exit criterion, cheap to mean now).
    "vt.global_cursor_default=0",
    # The lid panel is not a display this OS drives -- ADR 0007 decision 1. The
    # lowercase d forces the connector off at i915 probe time, before fbcon,
    # plymouth or any compositor can touch it; the panel's power sequence never
    # runs. Held back until the name was read off the target rather than guessed:
    # video= is a plain string match with no error path, so a wrong token is a
    # silent no-op. The 2026-08-05 boots logged it -- marwanos-panel: connector
    # card0-eDP-1 -> karg name 'eDP-1'. NEVER aim this at HDMI-A-* or DP-*:
    # nvidia-drm honours connector->force too, and a token meant for the Intel
    # card would take the appliance's only screen with it. If the panel must come
    # back (dev use, no external display), marwanos-panel.service already writes
    # 'detect' to the connector a few seconds into boot -- that unit is the
    # re-enable policy this karg relies on.
    "video=eDP-1:d",
]

match-architectures = ["x86_64"]
