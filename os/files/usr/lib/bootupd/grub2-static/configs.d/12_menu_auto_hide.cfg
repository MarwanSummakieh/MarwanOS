# MarwanOS: hide GRUB's menu after a boot the OS vouched for.
#
# bootupd assembles /boot/grub2/grub.cfg at INSTALL TIME from
# grub-static-pre.cfg plus this directory, sorted by name -- so this file
# only reaches machines installed from an image that carries it. The bench
# installed before it existed got the same logic hand-written into
# /boot/grub2/custom.cfg (sourced every boot by 41_custom.cfg), which is the
# one supported hook into an already-written grub.cfg.
#
# grub-static-pre.cfg hardcodes `timeout_style=menu` + `timeout=1`: a text
# menu flashes on every boot of a machine whose acceptance gate is a camera
# finding zero text frames. It does `load_env` -- which is why setting
# menu_auto_hide/boot_success with grub2-editenv looked like it should work
# -- but nothing in the static config ever READ those variables; they were
# loaded and ignored. This file is the missing reader.
#
# The Fedora Workstation contract, reimplemented: hide only when the
# PREVIOUS boot proved out. boot_success is cleared here on every boot and
# re-recorded by marwanos-boot-success.timer two minutes into a session
# that reached greetd -- so a boot that dies before the shell leaves it 0,
# and the next boot falls through to the pre.cfg's visible menu/1s, which
# is the one moment a person can still pick the previous deployment on a
# machine with no other console. Named 12_* so 14_menu_show_once still
# wins afterwards: an explicit "show the menu next boot" request must beat
# the hide.
if [ "${menu_auto_hide}" = "1" -a "${boot_success}" = "1" ]; then
  set timeout_style=hidden
  set timeout=0
fi
set boot_success=0
save_env boot_success
